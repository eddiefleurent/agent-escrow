name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solidity:
    name: Solidity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.7.0

      - name: Format Check
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Contract Sizes
        run: forge build --sizes

      - name: Test
        run: forge test -vv

      - name: Invariant Test
        run: forge test --match-contract TaskEscrowInvariantsTest -vv

      - name: Gas Snapshot
        run: forge snapshot

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v6.2.0
        with:
          go-version: '1.26'
          cache-dependency-path: go-server/go.sum

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.7.0

      - name: Build Contracts
        run: forge build

      - name: Copy ABIs
        run: make go-abi

      - name: Format Check
        working-directory: go-server
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: go-server
        run: go vet ./...

      - name: Go Test
        working-directory: go-server
        run: go test ./...

      - name: Go Build
        working-directory: go-server
        run: go build -o bin/server ./cmd/server/
